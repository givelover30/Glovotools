<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CALCTOOLS — All-in-One Online Utility Platform | 1,544+ Free Calculators & Tools</title>
    <meta name="description" content="Discover 1,544+ free online calculators, converters, planners, generators, and PDF utilities. Fast, accurate, browser-local, and 100% free." />
    <meta name="keywords" content="calculators, online tools, unit converter, financial calculator, PDF tools, generators, planners, utility platform" />
    <link rel="canonical" href="https://calctools.io" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="CALCTOOLS — All-in-One Online Utility Platform" />
    <meta property="og:description" content="Access 1,544+ verified calculators, converters, and utilities. Fast, secure, browser-local processing." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://calctools.io" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CALCTOOLS — All-in-One Online Utility Platform" />
    <meta name="twitter:description" content="Access 1,544+ verified calculators, converters, and utilities. Fast, secure, browser-local processing." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CALCTOOLS",
      "url": "https://calctools.io",
      "description": "All-in-One Online Utility Platform featuring 1,544+ free calculators, converters, and tools.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://calctools.io/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('calctools_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
