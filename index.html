<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glovotools – Free Online Tools</title>
    <meta name="description" content="Glovotools offers free online calculators, unit converters, and PDF tools. Calculate, convert, and manage documents directly in your browser." />
    <meta name="keywords" content="calculators, online tools, unit converter, financial calculator, PDF tools, generators, planners, utility platform" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="canonical" href="https://glovotools.io" />

    <!-- Favicon Assets -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:site_name" content="Glovotools" />
    <meta property="og:title" content="Glovotools – Free Online Tools" />
    <meta property="og:description" content="Glovotools offers free online calculators, unit converters, and PDF tools. Calculate, convert, and manage documents directly in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://glovotools.io" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Glovotools – Free Online Tools" />
    <meta name="twitter:description" content="Glovotools offers free online calculators, unit converters, and PDF tools. Calculate, convert, and manage documents directly in your browser." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Glovotools",
      "url": "https://glovotools.io",
      "description": "Glovotools offers free online calculators, unit converters, and PDF tools. Calculate, convert, and manage documents directly in your browser.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://glovotools.io/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('glovotools_theme') || localStorage.getItem('calctools_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
